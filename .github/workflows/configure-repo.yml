name: configure-repo
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  configure:
    if: ${{ !github.event.repository.is_template }}
    uses: RageAgainstThePixel/workflows/.github/workflows/configure-action-repo.yml@main
    secrets:
      token: ${{ secrets.CI_TOKEN }}
      discord-webhook: ${{ secrets.ACTIONS_DISCORD_WEBHOOK }}
